<div class="app">

// ==================== 状态 ====================
var currentIndex = 0;
var answers = new Array(Q.length).fill(null);
var scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
var currentResult = null;

// ==================== DOM 引用 ====================
var introSection = document.getElementById('introSection');
var quizSection = document.getElementById('quizSection');
var resultSection = document.getElementById('resultSection');
var progressText = document.getElementById('progressText');
var progressFill = document.getElementById('progressFill');
var questionText = document.getElementById('questionText');
var optionsContainer = document.getElementById('optionsContainer');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var viewAllBtn = document.getElementById('viewAllBtn');
var shareBtn = document.getElementById('shareBtn');
var eggBtn = document.getElementById('eggBtn');
var allPeopleList = document.getElementById('allPeopleList');
var shareCard = document.getElementById('shareCard');
var shareContent = document.getElementById('shareContent');
var easterEgg = document.getElementById('easterEgg');
var resultName = document.getElementById('resultName');
var resultMbti = document.getElementById('resultMbti');
var resultQuote = document.getElementById('resultQuote');
var resultDesc = document.getElementById('resultDesc');
var resultMotivation = document.getElementById('resultMotivation');
var resultSchool = document.getElementById('resultSchool');

// ==================== 初始化 ====================
function init() {
  introSection.classList.remove('hidden');
  quizSection.classList.add('hidden');
  resultSection.style.display = 'none';
  allPeopleList.style.display = 'none';
  shareCard.style.display = 'none';
  easterEgg.style.display = 'none';
  currentIndex = 0;
  answers = new Array(Q.length).fill(null);
  scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
}

// ==================== 开始测试 ====================
startBtn.addEventListener('click', function() {
  introSection.classList.add('hidden');
  quizSection.classList.remove('hidden');
  currentIndex = 0;
  answers = new Array(Q.length).fill(null);
  scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  renderQuestion();
});

// ==================== 渲染当前题目 ====================
function renderQuestion() {
  if (currentIndex >= Q.length) {
    showResult();
    return;
  }
  var q = Q[currentIndex];
  questionText.textContent = (currentIndex + 1) + '. ' + q.q;
  
  optionsContainer.innerHTML = '';
  var opts = [
    { text: q.a, value: 'a' },
    { text: q.b, value: 'b' }
  ];
  
  opts.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    var marker = document.createElement('span');
    marker.className = 'marker';
    btn.appendChild(marker);
    var textSpan = document.createElement('span');
    textSpan.textContent = opt.text;
    btn.appendChild(textSpan);
    
    if (answers[currentIndex] === opt.value) {
      btn.classList.add('selected');
    }
    
    btn.addEventListener('click', function() {
      // 移除同组其他选中状态
      optionsContainer.querySelectorAll('.option-btn').forEach(function(b) {
        b.classList.remove('selected');
      });
      btn.classList.add('selected');
      answers[currentIndex] = opt.value;
      recalcScores();
    });
    
    optionsContainer.appendChild(btn);
  });
  
  // 更新按钮状态
  prevBtn.disabled = currentIndex === 0;
  if (currentIndex === Q.length - 1) {
    nextBtn.textContent = '查看结果';
  } else {
    nextBtn.textContent = '下一题';
  }
  
  updateProgress();
}

// ==================== 更新进度 ====================
function updateProgress() {
  var answered = answers.filter(function(a) { return a !== null; }).length;
  progressText.textContent = answered + ' / ' + Q.length;
  progressFill.style.width = (answered / Q.length * 100) + '%';
}

// ==================== 重新计分 ====================
function recalcScores() {
  scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  for (var i = 0; i < Q.length; i++) {
    if (answers[i] === null) continue;
    var dim = Q[i].dim;
    // 选项a对应维度的第一个字母，选项b对应第二个字母
    if (answers[i] === 'a') {
      scores[dim[0]] = (scores[dim[0]] || 0) + 1;
    } else {
      scores[dim[1]] = (scores[dim[1]] || 0) + 1;
    }
  }
}

// ==================== 上一题/下一题 ====================
prevBtn.addEventListener('click', function() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
});

nextBtn.addEventListener('click', function() {
  if (answers[currentIndex] === null) {
    alert('请先选择一个答案哦～');
    return;
  }
  if (currentIndex < Q.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResult();
  }
});

// ==================== 显示结果 ====================
function showResult() {
  recalcScores();
  
  var mbti = 
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.S >= scores.N ? 'S' : 'N') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');
  
  // 根据MBTI匹配最接近的名人
  var bestMatch = null;
  var bestScore = -1;
  
  C.forEach(function(person) {
    var score = 0;
    var p = person.mbti;
    // 计算匹配度：每个字母匹配得1分，完全不匹配得0分
    for (var k = 0; k < 4; k++) {
      if (p[k] === mbti[k]) score++;
    }
    // 如果完全相同，加分
    if (p === mbti) score += 2;
    if (score > bestScore) {
      bestScore = score;
      bestMatch = person;
    }
  });
  
  currentResult = bestMatch;
  
  // 显示结果
  quizSection.classList.add('hidden');
  resultSection.style.display = 'block';
  
  resultName.textContent = bestMatch.name;
  resultMbti.textContent = '相似特质类型：' + bestMatch.mbti;
  resultQuote.textContent = bestMatch.quote;
  resultDesc.textContent = bestMatch.desc;
  resultMotivation.textContent = bestMatch.motivation;
  resultSchool.innerHTML = '—— ' + bestMatch.school + ' ——';
  
  // 重置附加内容
  allPeopleList.style.display = 'none';
  shareCard.style.display = 'none';
  easterEgg.style.display = 'none';
  allPeopleList.innerHTML = '';
  easterEgg.innerHTML = '';
}

// ==================== 查看全部名人 ====================
viewAllBtn.addEventListener('click', function() {
  if (allPeopleList.style.display === 'block') {
    allPeopleList.style.display = 'none';
    viewAllBtn.textContent = '查看全部名人';
    return;
  }
  var html = '<div style="font-weight:700;color:#1a3b2e;margin-bottom:10px;font-size:1rem;">无锡师专杰出校友名录（部分）</div>';
  C.forEach(function(p) {
    html += '<div class="person-item"><span class="person-name">' + p.name + '</span> · ' + p.mbti + '</div>';
  });
  html += '<div style="margin-top:12px;font-size:0.8rem;color:#6a8a7a;text-align:center;">无锡师专已培养7万余名专业人才，校友中两院院士9人[citation:31]</div>';
  allPeopleList.innerHTML = html;
  allPeopleList.style.display = 'block';
  viewAllBtn.textContent = '收起名人名录';
});

// ==================== 生成分享卡片 ====================
shareBtn.addEventListener('click', function() {
  if (shareCard.style.display === 'block') {
    shareCard.style.display = 'none';
    shareBtn.textContent = '生成分享卡片';
    return;
  }
  if (!currentResult) return;
  
  var html = '<div style="font-size:1.1rem;font-weight:700;margin-bottom:8px;">' + currentResult.name + '</div>';
  html += '<div style="font-size:0.85rem;opacity:0.9;margin-bottom:8px;">' + currentResult.quote + '</div>';
  html += '<div style="font-size:0.82rem;line-height:1.6;opacity:0.95;">' + currentResult.motivation + '</div>';
  shareContent.innerHTML = html;
  shareCard.style.display = 'block';
  shareBtn.textContent = '收起分享卡片';
});

// ==================== 重新测试 ====================
restartBtn.addEventListener('click', function() {
  init();
  quizSection.classList.add('hidden');
  resultSection.style.display = 'none';
  introSection.classList.remove('hidden');
});

// ==================== 启动 ====================
init();
</script>
